name: StreamForge CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Format check
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -cover ./...
      - name: Fuzz Stream DSL parser
        run: go test -fuzz=FuzzParseStreamDSL -fuzztime=5s ./internal/stream
      - name: Build binaries
        run: |
          go build ./cmd/streamforge
          go build ./cmd/streamforge-cli
